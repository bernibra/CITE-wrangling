metadata:
  doi: doi.org/10.1172/jci.insight.165299
  description: '6 patients with severe COVID-19 were followed longitudinally during
    hospitalization and up to 1 year after infection, when they also received a vaccine.
    For each time point and patient, PBMCs were collected and split into 3 pools:
    1/3 was sequenced straight; from 1/3 of the samples B cells were enriched (B cell
    enrichment kit from StemCell) and from 1/3 of the samples, antigen-specific cells
    were sorted using barcoded N, S and RBD probes. All samples were further stained
    using a cocktail of 181 barcoded Abs.'
  tissue: PBMC
  species: Homo sapiens
  alias: Scharf_2022
  genome_build: GRCh38
